<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Afrekening — DJ·World</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-[#0d0d0d] text-white min-h-screen font-sans">

  <aside id="sidebar" class="w-52 bg-[#1e1e1e] border-r border-[#2a2a2a] fixed h-full z-40 top-0 left-0 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out"></aside>

  <main class="md:ml-52 p-4 pt-16 md:p-8 md:pt-8 max-w-3xl">

    <div class="mb-6">
      <h1 class="text-xl font-bold">Bulk Afrekening</h1>
      <p class="text-gray-500 text-sm mt-0.5">Genereer voor alle personen tegelijk een PDF over een selectie statements</p>
    </div>

    <!-- Stap 1: Statements -->
    <div class="bg-[#1e1e1e] border border-[#2a2a2a] rounded-xl p-5 mb-4">
      <h2 class="text-sm font-semibold text-white mb-1">Stap 1 — Selecteer statements</h2>
      <p class="text-gray-500 text-xs mb-4">Kies de periodes die meegenomen worden in de afrekening</p>
      <div id="stmtList" class="space-y-2">
        <p class="text-gray-600 text-sm">Laden...</p>
      </div>
      <div class="mt-3 flex gap-3">
        <button onclick="selectAllStatements()" class="text-xs text-gray-400 hover:text-white transition-colors">Alles selecteren</button>
        <button onclick="deselectAllStatements()" class="text-xs text-gray-400 hover:text-white transition-colors">Alles deselecteren</button>
      </div>
    </div>

    <!-- Stap 2: Personen -->
    <div class="bg-[#1e1e1e] border border-[#2a2a2a] rounded-xl p-5 mb-4">
      <h2 class="text-sm font-semibold text-white mb-1">Stap 2 — Personen</h2>
      <p class="text-gray-500 text-xs mb-4">Alle personen met gekoppelde artiesten</p>
      <div id="personList" class="space-y-1.5">
        <p class="text-gray-600 text-sm">Laden...</p>
      </div>
      <div class="mt-3 flex gap-3">
        <button onclick="selectAllPersons()" class="text-xs text-gray-400 hover:text-white transition-colors">Alles selecteren</button>
        <button onclick="deselectAllPersons()" class="text-xs text-gray-400 hover:text-white transition-colors">Alles deselecteren</button>
      </div>
    </div>

    <!-- Actieknoppen -->
    <div class="flex gap-3 mb-6">
      <button id="btnGenereer" onclick="startBulk('pdf')"
        class="flex items-center gap-2 bg-[#FFD100] hover:bg-[#c9aa00] text-black font-bold px-5 py-3 rounded-lg text-sm transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Genereer alle PDF's (ZIP)
      </button>
      <button id="btnEmail" disabled title="Domein nog niet geverifieerd in Resend"
        class="flex items-center gap-2 border border-[#2a2a2a] text-gray-600 px-5 py-3 rounded-lg text-sm cursor-not-allowed opacity-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        Verstuur per email (binnenkort)
      </button>
    </div>

    <!-- Voortgang -->
    <div id="progressSection" class="hidden bg-[#1e1e1e] border border-[#2a2a2a] rounded-xl p-5">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-sm font-semibold text-white" id="progressTitle">Bezig...</h2>
        <span id="progressCount" class="text-gray-500 text-xs"></span>
      </div>
      <div class="w-full bg-[#2a2a2a] rounded-full h-2 mb-4">
        <div id="progressBar" class="bg-[#FFD100] h-2 rounded-full transition-all duration-300" style="width:0%"></div>
      </div>
      <div id="progressLog" class="space-y-1 max-h-48 overflow-y-auto text-xs text-gray-400"></div>
    </div>

  </main>

  <!-- Verborgen render-div voor PDF generatie -->
  <div id="pdfRender" style="position:fixed;top:0;left:0;width:820px;background:#fff;padding:20px;font-family:Arial,sans-serif;font-size:10pt;color:#111;visibility:hidden;pointer-events:none;z-index:9999"></div>

  <script src="shared.js"></script>
  <script>
    let allStatements = []
    let allPersons    = []

    async function loadPage() {
      const session = await initPage('bulk')
      if (!session) return
      await Promise.all([loadStatements(), loadPersons()])
    }

    async function loadStatements() {
      const { data } = await db.from('statements').select('id, period, filename').order('uploaded_at', { ascending: false })
      allStatements = data || []
      const list = document.getElementById('stmtList')
      if (!allStatements.length) { list.innerHTML = '<p class="text-gray-600 text-sm">Geen statements beschikbaar.</p>'; return }
      list.innerHTML = allStatements.map(s => `
        <label class="flex items-center gap-3 p-2.5 bg-[#0d0d0d] rounded-lg cursor-pointer hover:bg-[#2a2a2a] transition-colors">
          <input type="checkbox" value="${s.id}" class="stmtCheck w-4 h-4 accent-[#FFD100]" checked>
          <span class="text-white text-sm">${s.period || s.filename}</span>
        </label>
      `).join('')
    }

    async function loadPersons() {
      const { data: persons } = await db.from('persons').select('*').order('last_name')
      const { data: artists } = await db.from('artists').select('id, name, person_id')
      const byPerson = {}
      ;(artists || []).forEach(a => {
        if (!a.person_id) return
        if (!byPerson[a.person_id]) byPerson[a.person_id] = []
        byPerson[a.person_id].push(a)
      })
      allPersons = (persons || []).map(p => ({ ...p, artists: byPerson[p.id] || [] }))

      const list = document.getElementById('personList')
      if (!allPersons.length) { list.innerHTML = '<p class="text-gray-600 text-sm">Geen personen gevonden.</p>'; return }
      list.innerHTML = allPersons.map(p => {
        const hasArtists = p.artists.length > 0
        const hasEmail   = !!p.email
        return `
          <div class="flex items-center justify-between py-2 border-b border-[#2a2a2a]/50 last:border-0">
            <div class="flex items-center gap-3">
              <input type="checkbox" value="${p.id}" class="personCheck w-4 h-4 accent-[#FFD100]" ${hasArtists ? 'checked' : 'disabled'}>
              <div>
                <span class="text-sm ${hasArtists ? 'text-white' : 'text-gray-600'}">${p.first_name} ${p.last_name}</span>
                <span class="text-gray-600 text-xs ml-2">${p.artists.length} artiest${p.artists.length !== 1 ? 'en' : ''}</span>
              </div>
            </div>
            <div class="flex items-center gap-2 text-xs">
              ${hasEmail
                ? `<span class="text-gray-400">${p.email}</span>`
                : `<span class="text-gray-600 italic">geen email</span>`}
            </div>
          </div>
        `
      }).join('')
    }

    function selectAllStatements()   { document.querySelectorAll('.stmtCheck').forEach(c => c.checked = true) }
    function deselectAllStatements() { document.querySelectorAll('.stmtCheck').forEach(c => c.checked = false) }
    function selectAllPersons()      { document.querySelectorAll('.personCheck:not(:disabled)').forEach(c => c.checked = true) }
    function deselectAllPersons()    { document.querySelectorAll('.personCheck:not(:disabled)').forEach(c => c.checked = false) }

    function log(msg, type = 'normal') {
      const el = document.getElementById('progressLog')
      const colors = { normal: 'text-gray-400', success: 'text-green-400', error: 'text-red-400', info: 'text-[#FFD100]' }
      const safe = String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      el.innerHTML += `<div class="${colors[type]}">${safe}</div>`
      el.scrollTop = el.scrollHeight
    }

    function setProgress(current, total) {
      const pct = total > 0 ? Math.round(current / total * 100) : 0
      document.getElementById('progressBar').style.width = pct + '%'
      document.getElementById('progressCount').textContent = `${current} / ${total}`
    }

    async function startBulk(mode) {
      const selectedStmtIds  = [...document.querySelectorAll('.stmtCheck:checked')].map(c => c.value)
      const selectedPersonIds = [...document.querySelectorAll('.personCheck:checked')].map(c => c.value)

      if (!selectedStmtIds.length)   { showToast('Selecteer minimaal één statement.', 'error'); return }
      if (!selectedPersonIds.length) { showToast('Selecteer minimaal één persoon.', 'error'); return }

      const persons = allPersons.filter(p => selectedPersonIds.includes(p.id))

      // Voortgang tonen
      document.getElementById('progressSection').classList.remove('hidden')
      document.getElementById('progressTitle').textContent = 'PDF\'s genereren...'
      document.getElementById('progressLog').innerHTML = ''
      setProgress(0, persons.length)
      document.getElementById('btnGenereer').disabled = true

      // Alle data in één keer ophalen
      log('Data ophalen...', 'info')
      const allArtistIds = persons.flatMap(p => p.artists.map(a => a.id))

      const { data: tas } = await db
        .from('track_artists')
        .select('artist_id, split_percentage, tracks(id, title, releases(catalog_number))')
        .in('artist_id', allArtistIds)

      const allTrackIds = (tas || []).map(ta => ta.tracks?.id).filter(Boolean)

      let lines = [], from = 0
      while (allTrackIds.length) {
        const { data: page } = await db
          .from('statement_lines')
          .select('track_id, nett_royalty, usage_type, statement_id')
          .in('statement_id', selectedStmtIds)
          .in('track_id', allTrackIds)
          .range(from, from + 999)
        if (!page || page.length === 0) break
        lines.push(...page)
        if (page.length < 1000) break
        from += 1000
      }

      const { data: stmts } = await db.from('statements').select('id, period, filename').in('id', selectedStmtIds)
      const periods = (stmts || []).map(s => s.period || s.filename)

      // Royalties per track. Elke regel wordt meteen gesplitst met het tarief van
      // zijn eigen statement; pas daarna optellen. Anders zou een selectie met
      // statements van 2025 én 2026 er één gemiddeld tarief overheen gooien.
      const royPerTrack = {}
      const aggPcts = [], djPcts = []
      lines.forEach(l => {
        if (!l.track_id) return
        if (!royPerTrack[l.track_id]) royPerTrack[l.track_id] = { total: 0, stream: 0, download: 0, agg: 0, dj: 0, net: 0 }
        const s = splitBedrag(l.nett_royalty, l.statement_id)
        aggPcts.push(s.aggPct)
        djPcts.push(s.djPct)
        const r = royPerTrack[l.track_id]
        r.total += s.bruto
        r.agg   += s.aggAmt
        r.dj    += s.djAmt
        r.net   += s.netAmt
        if (l.usage_type === 'stream')   r.stream   += s.bruto
        if (l.usage_type === 'download') r.download += s.bruto
      })

      // Labels: één tarief → "30%", meerdere → "wisselend"
      const aggLabel = pctLabel(aggPcts)
      const djLabel  = pctLabel(djPcts)
      const gemengd  = aggLabel === 'wisselend' || djLabel === 'wisselend'

      // Bij gemengde tarieven: specificatieregels per statement, zodat de
      // artiest kan narekenen welk percentage waar is gebruikt.
      const gebruikteStmts = new Set(lines.map(l => l.statement_id))
      const tariefRegels = (stmts || [])
        .filter(s => gebruikteStmts.has(s.id))
        .map(s => {
          const r = STATEMENT_RATES[s.id] || {}
          return { periode: s.period || s.filename, agg: fmtPct(r.agg), dj: fmtPct(r.dj) }
        })

      log(`Data geladen — ${lines.length} regels voor ${allTrackIds.length} tracks`, 'info')

      // ZIP aanmaken
      const renderEl = document.getElementById('pdfRender')
      const zip  = new JSZip()
      const today = new Date().toLocaleDateString('nl-NL', { day: '2-digit', month: '2-digit', year: 'numeric' })
      const eur = v => {
        if (Math.abs(v) < 0.005) v = 0
        return new Intl.NumberFormat('nl-NL', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(v)
      }
      const eurDJ = v => Math.abs(v) < 0.005 ? '€0,00' : '-' + eur(v)

      // Logo laden — eerst bestaand DOM-element (al geladen in sidebar), dan fetch als fallback
      let logoDataURL = null
      let logoAspect  = 3.5
      const sidebarLogoEl = document.querySelector('#sidebar img')
      if (sidebarLogoEl?.complete && sidebarLogoEl.naturalWidth > 0) {
        try {
          const cvs = document.createElement('canvas')
          cvs.width  = sidebarLogoEl.naturalWidth
          cvs.height = sidebarLogoEl.naturalHeight
          cvs.getContext('2d').drawImage(sidebarLogoEl, 0, 0)
          logoDataURL = cvs.toDataURL('image/png')
          logoAspect  = sidebarLogoEl.naturalWidth / sidebarLogoEl.naturalHeight
        } catch(e) {}
      }
      if (!logoDataURL) {
        try {
          const resp = await fetch('https://marnixvanroyen.github.io/dutch-agency-portal/djworld-logo.png')
          if (resp.ok) {
            const blob = await resp.blob()
            logoDataURL = await new Promise(res => {
              const reader = new FileReader()
              reader.onload = () => res(reader.result)
              reader.readAsDataURL(blob)
            })
            const tmpImg = new Image()
            tmpImg.src = logoDataURL
            await new Promise(r => { tmpImg.onload = r; tmpImg.onerror = r })
            if (tmpImg.naturalWidth > 0) logoAspect = tmpImg.naturalWidth / tmpImg.naturalHeight
          }
        } catch(e) {}
      }

      for (let i = 0; i < persons.length; i++) {
        const p = persons[i]
        const fullName = `${p.first_name} ${p.last_name}`
        log(`${fullName} — HTML bouwen...`)

        const artistIds = p.artists.map(a => a.id)
        const pTas = (tas || []).filter(ta => artistIds.includes(ta.artist_id))

        // Per artiest breakdown
        const artistBreakdown = {}
        pTas.forEach(ta => {
          const aid = ta.artist_id
          if (!ta.tracks?.id) return
          const roy = royPerTrack[ta.tracks.id]
          if (!roy) return
          const splitPct = (parseFloat(ta.split_percentage) || 0) / 100
          const gross    = roy.total * splitPct
          const aggAmt   = roy.agg   * splitPct
          const djAmt    = roy.dj    * splitPct
          const net      = roy.net   * splitPct
          if (!artistBreakdown[aid]) artistBreakdown[aid] = { tracks: [], gross: 0, agg: 0, dj: 0, net: 0 }
          artistBreakdown[aid].tracks.push({
            title: ta.tracks.title || `⚠️ ${ta.tracks.releases?.catalog_number || '?'}`,
            splitPct: ta.split_percentage,
            stream: roy.stream * splitPct,
            download: roy.download * splitPct,
            gross, aggAmt, djAmt, net
          })
          artistBreakdown[aid].gross += gross
          artistBreakdown[aid].agg   += aggAmt
          artistBreakdown[aid].dj    += djAmt
          artistBreakdown[aid].net   += net
        })

        const grandGross = Object.values(artistBreakdown).reduce((s, a) => s + a.gross, 0)
        const grandAgg   = Object.values(artistBreakdown).reduce((s, a) => s + a.agg,   0)
        const grandDJ    = Object.values(artistBreakdown).reduce((s, a) => s + a.dj,    0)
        const grandNet   = Object.values(artistBreakdown).reduce((s, a) => s + a.net,   0)

        // HTML opbouwen (zelfde stijl als afrekening.html)
        const html = `
          <div style="font-family:Arial,sans-serif;font-size:10pt;color:#111;max-width:780px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;padding-bottom:12px;border-bottom:2px solid #111">
              <div style="font-size:18pt;font-weight:bold;color:#111">DJ·World</div>
              <div style="text-align:right;font-size:9.5pt;line-height:1.5">
                <div style="font-weight:bold;font-size:11pt">${fullName}</div>
                ${p.street      ? `<div>${p.street}</div>` : ''}
                ${p.postal_code || p.city ? `<div>${[p.postal_code, p.city].filter(Boolean).join(' ')}</div>` : ''}
                ${p.email ? `<div style="margin-top:3px">${p.email}</div>` : ''}
                ${p.iban  ? `<div style="font-family:monospace;font-size:8pt">${p.iban}</div>` : ''}
              </div>
            </div>

            <div style="font-size:14pt;font-weight:bold;margin-bottom:3px">Royalty Afrekening</div>
            <div style="font-size:8.5pt;color:#555;margin-bottom:14px">Datum: ${today} &nbsp;·&nbsp; Periode: ${periods.join(', ')}</div>

            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
              <div style="border:1px solid #ddd;border-radius:5px;padding:8px 12px">
                <div style="font-size:6.5pt;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Bruto inkomsten</div>
                <div style="font-size:11pt;font-weight:bold">${eur(grandGross)}</div>
              </div>
              <div style="border:1px solid #ddd;border-radius:5px;padding:8px 12px">
                <div style="font-size:6.5pt;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Aggregator ${aggLabel}</div>
                <div style="font-size:11pt;font-weight:bold;color:#b88a00">-${eur(grandAgg)}</div>
              </div>
              <div style="border:1px solid #ddd;border-radius:5px;padding:8px 12px">
                <div style="font-size:6.5pt;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">DJ·World ${djLabel}</div>
                <div style="font-size:11pt;font-weight:bold;color:#b88a00">-${eur(grandDJ)}</div>
              </div>
              <div style="border:1px solid #333;border-radius:5px;padding:8px 12px;background:#f9f9f9">
                <div style="font-size:6.5pt;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px">Jouw netto</div>
                <div style="font-size:11pt;font-weight:bold;color:#1a7a3a">${eur(grandNet)}</div>
              </div>
            </div>

            ${!gemengd ? '' : `
            <div style="border:1px solid #ddd;border-radius:5px;padding:8px 12px;margin-bottom:14px">
              <div style="font-size:6.5pt;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">Gehanteerde tarieven per periode</div>
              ${tariefRegels.map(t => `<div style="font-size:8pt;display:flex;justify-content:space-between;padding:1px 0">
                <span>${t.periode}</span>
                <span style="color:#666">Aggregator ${t.agg} &nbsp;·&nbsp; DJ·World ${t.dj}</span>
              </div>`).join('')}
            </div>`}

            ${p.artists.map(a => {
              const ab = artistBreakdown[a.id]
              if (!ab) return `<div style="margin-bottom:12px"><div style="font-weight:bold;border-bottom:1px solid #ccc;padding-bottom:4px;margin-bottom:6px">${a.name} <span style="font-weight:normal;color:#999;font-size:8.5pt">— geen royalties</span></div></div>`
              return `
                <div style="margin-bottom:14px">
                  <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #ccc;padding-bottom:4px;margin-bottom:6px">
                    <div style="font-weight:bold;font-size:10.5pt">${a.name}</div>
                    <div style="color:#1a7a3a;font-weight:bold;font-size:9.5pt">${eur(ab.net)}</div>
                  </div>
                  <table style="width:100%;border-collapse:collapse;font-size:8pt">
                    <thead>
                      <tr style="background:#f2f2f2">
                        <th style="text-align:left;padding:4px 6px;font-size:7pt;text-transform:uppercase;color:#555;border-bottom:1px solid #ddd">Track</th>
                        <th style="text-align:right;padding:4px 6px;font-size:7pt;text-transform:uppercase;color:#555;border-bottom:1px solid #ddd">Split</th>
                        <th style="text-align:right;padding:4px 6px;font-size:7pt;text-transform:uppercase;color:#555;border-bottom:1px solid #ddd">Streams</th>
                        <th style="text-align:right;padding:4px 6px;font-size:7pt;text-transform:uppercase;color:#555;border-bottom:1px solid #ddd">Downloads</th>
                        <th style="text-align:right;padding:4px 6px;font-size:7pt;text-transform:uppercase;color:#555;border-bottom:1px solid #ddd">Bruto</th>
                        <th style="text-align:right;padding:4px 6px;font-size:7pt;text-transform:uppercase;color:#b88a00;border-bottom:1px solid #ddd">Aggregator</th>
                        <th style="text-align:right;padding:4px 6px;font-size:7pt;text-transform:uppercase;color:#b88a00;border-bottom:1px solid #ddd">DJ·World</th>
                        <th style="text-align:right;padding:4px 6px;font-size:7pt;text-transform:uppercase;color:#1a7a3a;border-bottom:1px solid #ddd">Netto</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${ab.tracks.sort((x,y) => y.net - x.net).map(t => `
                        <tr>
                          <td style="padding:3px 6px;border-bottom:1px solid #eee">${t.title}</td>
                          <td style="padding:3px 6px;border-bottom:1px solid #eee;text-align:right;color:#777">${t.splitPct}%</td>
                          <td style="padding:3px 6px;border-bottom:1px solid #eee;text-align:right;color:#555">${eur(t.stream)}</td>
                          <td style="padding:3px 6px;border-bottom:1px solid #eee;text-align:right;color:#555">${eur(t.download)}</td>
                          <td style="padding:3px 6px;border-bottom:1px solid #eee;text-align:right">${eur(t.gross)}</td>
                          <td style="padding:3px 6px;border-bottom:1px solid #eee;text-align:right;color:#b88a00">-${eur(t.aggAmt)}</td>
                          <td style="padding:3px 6px;border-bottom:1px solid #eee;text-align:right;color:#b88a00">-${eur(t.djAmt)}</td>
                          <td style="padding:3px 6px;border-bottom:1px solid #eee;text-align:right;color:#1a7a3a;font-weight:bold">${eur(t.net)}</td>
                        </tr>
                      `).join('')}
                      <tr style="background:#fafafa;font-weight:bold">
                        <td colspan="4" style="padding:4px 6px">Totaal ${a.name}</td>
                        <td style="padding:4px 6px;text-align:right">${eur(ab.gross)}</td>
                        <td style="padding:4px 6px;text-align:right;color:#b88a00">-${eur(ab.agg)}</td>
                        <td style="padding:4px 6px;text-align:right;color:#b88a00">-${eur(ab.dj)}</td>
                        <td style="padding:4px 6px;text-align:right;color:#1a7a3a">${eur(ab.net)}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>`
            }).join('')}

            <div style="margin-top:14px;padding-top:10px;border-top:1px solid #ccc;display:flex;justify-content:space-between;font-size:8.5pt;color:#777">
              <span>DJ·World · info@dj-world.nl</span>
              <span>Totaal netto: <strong style="color:#1a7a3a">${eur(grandNet)}</strong></span>
            </div>
          </div>
        `

        // HTML in render div zetten
        renderEl.innerHTML = html

        log(`${fullName} — PDF genereren...`)

        try {
          const { jsPDF } = window.jspdf
          const doc = new jsPDF({ unit: 'mm', format: 'a4' })
          const pw  = doc.internal.pageSize.getWidth()
          const ph  = doc.internal.pageSize.getHeight()
          const YELLOW = [255, 209, 0]
          const GREEN  = [26, 122, 58]
          const GOLD   = [160, 110, 0]
          const DARK   = [30, 30, 30]
          const GRAY   = [120, 120, 120]

          // ── Gele accentbalk bovenaan ─────────────────────────────
          doc.setFillColor(...YELLOW).rect(0, 0, pw, 7, 'F')

          // ── Logo (echt beeld of fallback tekst) ──────────────────
          // Logo vult de ruimte tussen gele balk (7mm) en scheidingslijn (36mm) → 26mm hoog
          const LOGO_H = 26
          const LOGO_W = Math.min(logoAspect * LOGO_H, 70)
          if (logoDataURL) {
            doc.addImage(logoDataURL, 'PNG', 14, 8, LOGO_W, LOGO_H)
          } else {
            doc.setFontSize(22).setFont('helvetica','bold').setTextColor(...DARK)
            doc.text('DJ·World', 14, 28)
          }

          // ── Adresblok rechts — uitlijnen op zelfde hoogte als logo ──
          const ADDR_TOP = 12
          doc.setFont('helvetica','bold').setFontSize(10).setTextColor(...DARK)
          doc.text(fullName, pw - 14, ADDR_TOP, { align: 'right' })
          doc.setFont('helvetica','normal').setFontSize(8.5).setTextColor(...GRAY)
          const addrLines = [
            p.street || '',
            [p.postal_code, p.city].filter(Boolean).join(' '),
            p.email || '',
            p.iban  || ''
          ].filter(Boolean)
          let ay = ADDR_TOP + 5
          addrLines.forEach(l => { doc.text(l, pw - 14, ay, { align: 'right' }); ay += 4.5 })

          // Scheidingslijn — onder het adresblok (IBAN eindigt op ~30mm, lijn op 36mm)
          const headerBottom = 36
          doc.setDrawColor(...DARK).setLineWidth(0.4).line(14, headerBottom, pw - 14, headerBottom)
          let y = headerBottom + 7

          // ── Titel + datum ────────────────────────────────────────
          doc.setFontSize(15).setFont('helvetica','bold').setTextColor(...DARK)
          doc.text('Royalty Afrekening', 14, y)
          y += 5.5
          doc.setFontSize(8).setFont('helvetica','normal').setTextColor(...GRAY)
          doc.text(`Datum: ${today}   ·   Periode: ${periods.join(', ')}`, 14, y)
          doc.setTextColor(...DARK)
          y += 9

          // ── Samenvatting blokken ─────────────────────────────────
          const bw  = (pw - 28 - 12) / 4
          const bh  = 18
          const boxes = [
            { label: 'Bruto inkomsten',            value: eur(grandGross), fill: [248,248,248], border: [220,220,220], valColor: DARK },
            { label: `Aggregator ${aggLabel}`, value: `-${eur(grandAgg)}`, fill: [255,250,230], border: [220,200,100], valColor: GOLD },
            { label: `DJ·World ${djLabel}`,   value: `-${eur(grandDJ)}`,  fill: [255,250,230], border: [220,200,100], valColor: GOLD },
            { label: 'Jouw netto',                 value: eur(grandNet),   fill: [237,250,242], border: [150,210,175], valColor: GREEN },
          ]
          boxes.forEach((b, idx) => {
            const bx = 14 + idx * (bw + 4)
            doc.setFillColor(...b.fill).setDrawColor(...b.border).setLineWidth(0.4)
            doc.roundedRect(bx, y, bw, bh, 2, 2, 'FD')
            doc.setFontSize(6.5).setFont('helvetica','normal').setTextColor(...GRAY)
            doc.text(b.label.toUpperCase(), bx + 4, y + 5.5)
            doc.setFontSize(11).setFont('helvetica','bold').setTextColor(...b.valColor)
            doc.text(b.value, bx + 4, y + 13)
          })
          doc.setTextColor(...DARK).setFont('helvetica','normal')
          y += bh + 8

          // ── Specificatie bij gemengde tarieven ───────────────────
          if (gemengd && tariefRegels.length) {
            doc.setFontSize(6.5).setTextColor(...GRAY)
            doc.text('GEHANTEERDE TARIEVEN PER PERIODE', 14, y)
            y += 4
            doc.setFontSize(7.5).setTextColor(...DARK)
            tariefRegels.forEach(t => {
              doc.text(t.periode, 14, y)
              doc.text(`Aggregator ${t.agg}   ·   DJ·World ${t.dj}`, pw - 14, y, { align: 'right' })
              y += 4
            })
            doc.setTextColor(...DARK)
            y += 5
          }

          // ── Per artiest ──────────────────────────────────────────
          p.artists.forEach(a => {
            const ab = artistBreakdown[a.id]

            // Artiest koptekst — gele accentlijn + naam
            doc.setFillColor(...YELLOW).rect(14, y - 1, 2, 6, 'F')
            doc.setFontSize(10).setFont('helvetica','bold').setTextColor(...DARK)
            doc.text(a.name, 19, y + 4)
            if (ab) {
              doc.setTextColor(...GREEN)
              doc.text(eur(ab.net), pw - 14, y + 4, { align: 'right' })
            }
            doc.setTextColor(...DARK)
            doc.setDrawColor(220,220,220).setLineWidth(0.2).line(14, y + 6.5, pw - 14, y + 6.5)
            y += 10

            if (!ab) {
              doc.setFontSize(8).setFont('helvetica','italic').setTextColor(...GRAY)
              doc.text('Geen royalties in deze periode', 17, y + 3)
              doc.setTextColor(...DARK).setFont('helvetica','normal')
              y += 10
              return
            }

            doc.autoTable({
              startY: y,
              margin: { left: 14, right: 14 },
              styles: { fontSize: 7.5, cellPadding: 2, textColor: [...DARK] },
              headStyles: {
                fillColor: [30,30,30], textColor: [255,255,255],
                fontStyle: 'bold', fontSize: 7
              },
              columnStyles: {
                0: { cellWidth: 'auto' },
                1: { cellWidth: 23, halign: 'right' },
                2: { cellWidth: 23, halign: 'right' },
                3: { cellWidth: 23, halign: 'right' },
                4: { cellWidth: 23, halign: 'right' },
                5: { cellWidth: 23, halign: 'right' },
                6: { cellWidth: 23, halign: 'right' },
              },
              columns: [
                { header: 'Track',      dataKey: 'title' },
                { header: 'Streams',    dataKey: 'stream' },
                { header: 'Downloads',  dataKey: 'download' },
                { header: 'Bruto',      dataKey: 'gross' },
                { header: 'Aggregator', dataKey: 'agg' },
                { header: 'DJ·World',   dataKey: 'dj' },
                { header: 'Netto',      dataKey: 'net' },
              ],
              body: [
                ...ab.tracks.sort((ta, tb) => tb.net - ta.net).map(t => ({
                  title: t.title,
                  stream: eur(t.stream), download: eur(t.download),
                  gross: eur(t.gross), agg: eurDJ(t.aggAmt), dj: eurDJ(t.djAmt), net: eur(t.net),
                })),
                {
                  title: `Totaal ${a.name}`, stream: '', download: '',
                  gross: eur(ab.gross), agg: eurDJ(ab.agg), dj: eurDJ(ab.dj), net: eur(ab.net)
                }
              ],
              didParseCell: (d) => {
                const isTotal = d.row.index === ab.tracks.length
                if (isTotal) {
                  d.cell.styles.fontStyle = 'bold'
                  d.cell.styles.fillColor = [...YELLOW]
                  d.cell.styles.textColor = [...DARK]
                  d.cell.styles.fontSize  = 8.5
                }
                if (!isTotal && d.column.dataKey === 'net') d.cell.styles.textColor = [...GREEN]
                if (!isTotal && d.column.dataKey === 'dj')  d.cell.styles.textColor = [...GOLD]
                if (!isTotal && d.column.dataKey === 'agg') d.cell.styles.textColor = [...GOLD]
                if (isTotal  && d.column.dataKey === 'net') d.cell.styles.textColor = [...GREEN]
                if (isTotal  && d.column.dataKey === 'dj')  d.cell.styles.textColor = [...GOLD]
                if (isTotal  && d.column.dataKey === 'agg') d.cell.styles.textColor = [...GOLD]
                if (d.section === 'head' && d.column.dataKey === 'net') d.cell.styles.textColor = [180,255,180]
                if (d.section === 'head' && d.column.dataKey === 'dj')  d.cell.styles.textColor = [255,235,150]
                if (d.section === 'head' && d.column.dataKey === 'agg') d.cell.styles.textColor = [255,235,150]
              }
            })
            y = doc.lastAutoTable.finalY + 8
          })

          // ── Footer ───────────────────────────────────────────────
          // Gele balk: 14mm hoog, tekst gecentreerd erin op ~8mm van onderkant
          doc.setFillColor(...YELLOW).rect(0, ph - 14, pw, 14, 'F')
          doc.setFontSize(8).setFont('helvetica','normal').setTextColor(...DARK)
          doc.text('DJ·World  ·  info@dj-world.nl', 14, ph - 6)
          doc.setFont('helvetica','bold').setTextColor(0, 100, 40)
          doc.text(`Totaal netto: ${eur(grandNet)}`, pw - 14, ph - 6, { align: 'right' })

          // Paginanummer
          const pageCount = doc.internal.getNumberOfPages()
          for (let pg = 1; pg <= pageCount; pg++) {
            doc.setPage(pg)
            doc.setFontSize(7).setFont('helvetica','normal').setTextColor(...GRAY)
            doc.text(`${pg} / ${pageCount}`, pw / 2, ph - 4, { align: 'center' })
          }

          const pdfBlob = doc.output('blob')
          const filename = `Afrekening_${fullName.replace(/\s+/g, '_')}_${periods.join('-').replace(/\s+/g, '')}.pdf`
          zip.file(filename, pdfBlob)
          log(`${fullName} — ✓ klaar`, 'success')
        } catch (err) {
          log(`${fullName} — ✗ mislukt: ${err.message}`, 'error')
        }

        setProgress(i + 1, persons.length)
      }

      renderEl.innerHTML = ''
      log('ZIP aanmaken en downloaden...', 'info')

      const zipBlob = await zip.generateAsync({ type: 'blob' })
      const url = URL.createObjectURL(zipBlob)
      const filename = `Afrekenigen_${periods.join('-')}_${new Date().toISOString().slice(0,10)}.zip`

      document.getElementById('progressTitle').textContent = '✓ Klaar!'
      document.getElementById('btnGenereer').disabled = false
      log('ZIP klaar — klik de knop hieronder om te downloaden.', 'success')

      // Zichtbare downloadknop tonen (werkt beter in Safari dan auto-click)
      const existing = document.getElementById('downloadLink')
      if (existing) existing.remove()
      const dlBtn = document.createElement('a')
      dlBtn.id       = 'downloadLink'
      dlBtn.href     = url
      dlBtn.download = filename
      dlBtn.className = 'mt-4 flex items-center gap-2 bg-green-600 hover:bg-green-500 text-white font-bold px-5 py-3 rounded-lg text-sm transition-colors w-fit'
      dlBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg> Download ZIP (${filename})`
      document.getElementById('progressLog').after(dlBtn)
    }

    loadPage()
  </script>
</body>
</html>
